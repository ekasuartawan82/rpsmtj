<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sistem RPS MTJ - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "primary-fixed": "#d7e3ff",
                            "inverse-on-surface": "#f0f0f2",
                            "on-secondary-container": "#425880",
                            "on-secondary-fixed": "#001b3e",
                            "secondary-fixed-dim": "#b0c7f5",
                            "tertiary-fixed": "#ffdbcb",
                            "tertiary": "#883700",
                            "on-primary-fixed-variant": "#00458e",
                            "on-error-container": "#93000a",
                            "secondary-fixed": "#d7e3ff",
                            "outline-variant": "#c1c6d5",
                            "on-tertiary": "#ffffff",
                            "surface-dim": "#d9dadc",
                            "on-error": "#ffffff",
                            "on-background": "#1a1c1d",
                            "on-primary": "#ffffff",
                            "on-surface": "#1a1c1d",
                            "on-primary-container": "#dfe8ff",
                            "inverse-surface": "#2f3132",
                            "on-tertiary-container": "#ffe3d6",
                            "surface-container-high": "#e8e8ea",
                            "secondary": "#495f87",
                            "surface-bright": "#f9f9fb",
                            "on-primary-fixed": "#001b3e",
                            "on-surface-variant": "#414753",
                            "primary-container": "#0066cc",
                            "surface-container-low": "#f3f3f5",
                            "error": "#ba1a1a",
                            "background": "#f9f9fb",
                            "surface-container-highest": "#e2e2e4",
                            "primary-fixed-dim": "#aac7ff",
                            "outline": "#727784",
                            "secondary-container": "#b9cffd",
                            "primary": "#004e9f",
                            "surface-tint": "#005cba",
                            "error-container": "#ffdad6",
                            "surface-variant": "#e2e2e4",
                            "on-tertiary-fixed-variant": "#793000",
                            "surface-container-lowest": "#ffffff",
                            "tertiary-container": "#af4900",
                            "surface-container": "#eeeef0",
                            "surface": "#f9f9fb",
                            "inverse-primary": "#aac7ff",
                            "on-tertiary-fixed": "#341100",
                            "tertiary-fixed-dim": "#ffb692",
                            "on-secondary-fixed-variant": "#30476d",
                            "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.125rem",
                            "lg": "0.25rem",
                            "xl": "0.5rem",
                            "full": "0.75rem"
                    },
                    "spacing": {},
                    "fontFamily": {
                            "headline": [
                                    "Inter"
                            ],
                            "body": [
                                    "Inter"
                            ],
                            "label": [
                                    "Inter"
                            ]
                    }
            },
                },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col justify-center items-center p-4">
<!-- Main Container -->
<main class="w-full max-w-md flex flex-col items-center justify-center flex-grow">
<!-- Header / Logo Area -->
<header class="mb-8 text-center flex flex-col items-center">
<div class="w-20 h-20 bg-surface-container-low rounded-xl flex items-center justify-center mb-6 shadow-sm shadow-slate-200/50">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">
                    school
                </span>
</div>
<h1 class="text-[2rem] font-bold text-on-surface tracking-tight mb-2 leading-tight">Sistem RPS MTJ</h1>
<p class="text-on-surface-variant text-base">Politeknik Transportasi Darat Bali</p>
</header>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-8 sm:p-10 shadow-[0_32px_64px_rgba(26,28,29,0.04)] relative z-10">
<!-- Error Message State -->
<div class="bg-error-container/50 border border-error/20 rounded-lg p-4 mb-6 flex items-start gap-3">
<span class="material-symbols-outlined text-error mt-0.5" style="font-variation-settings: 'FILL' 1;">
                    error
                </span>
<div>
<h3 class="text-error font-semibold text-sm">Kredensial Tidak Valid</h3>
<p class="text-error/80 text-xs mt-1">Email atau kata sandi yang Anda masukkan salah. Silakan coba lagi.</p>
</div>
</div>
<!-- Form Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface" for="email">Email Akademik</label>
<div class="relative">
<input class="block w-full rounded-md bg-surface-container-highest border-outline-variant/20 focus:border-primary focus:ring-1 focus:ring-primary text-on-surface text-base py-3 px-4 shadow-sm transition-colors" id="email" name="email" required="" type="email" value="admin@poltrada.ac.id"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block text-sm font-medium text-on-surface" for="password">Kata Sandi</label>
<a class="text-sm font-medium text-primary hover:text-primary-container transition-colors" href="#">Lupa sandi?</a>
</div>
<div class="relative">
<input class="block w-full rounded-md bg-surface-container-highest border-error focus:border-error focus:ring-1 focus:ring-error text-on-surface text-base py-3 px-4 shadow-sm transition-colors" id="password" name="password" required="" type="password" value="********"/>
<!-- Error Icon Indicator -->
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-error text-xl">
                                error
                            </span>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-on-surface-variant" for="remember-me">
                        Ingat saya di perangkat ini
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-base font-semibold text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" type="submit">
                    Masuk
                </button>
</form>
<div class="mt-8 text-center border-t border-surface-container-high pt-6">
<p class="text-sm text-on-surface-variant">
                    Butuh bantuan akses? <a class="font-medium text-primary hover:text-primary-container transition-colors" href="#">Hubungi IT Support</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full text-center py-6 mt-auto">
<p class="text-xs text-on-surface-variant/80">
            © 2024 Politeknik Transportasi Darat Bali. Hak Cipta Dilindungi.
        </p>
</footer>
</body></html>
